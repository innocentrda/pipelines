apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-writer
  labels:
    app: metadata-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadata-writer
  template:
    metadata:
      labels:
        app: metadata-writer
    spec:
      initContainers:
      - name: wait-for-grpc
        image: busybox
        command:
          - sh
          - -c
          - |
            echo "Waiting for metadata-grpc to be available...";
            until nc -z metadata-grpc-service.kubeflow.svc.cluster.local 8080; do
              echo "metadata-grpc not ready yet... sleeping";
              sleep 5;
            done;
            echo "metadata-grpc is ready.";
      containers:
      - name: main
        image: ghcr.io/kubeflow/kfp-metadata-writer:dummy
        env:
        - name: NAMESPACE_TO_WATCH
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
      serviceAccountName: kubeflow-pipelines-metadata-writer
